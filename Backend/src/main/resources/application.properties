# ========================
# MongoDB Configuration
# ========================
# Load overrides from the repo root .env file when present.
spring.config.import=optional:file:../.env,optional:file:.env

# Use the Atlas cluster directly, with an environment override if provided.
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://Education:thusanthaedu12345@cluster0.eagm2k2.mongodb.net/Education?appName=Education}

# Database name can be overridden by APP_MONGO_DATABASE.
app.mongo.database=${APP_MONGO_DATABASE:Education}

# ========================
# Server Configuration
# ========================
server.port=8080

# ========================
# CORS Configuration
# ========================
spring.web.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}

app.jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToSomethingLongAndSecureForProduction123!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default first-run admin account
app.admin.seed.email=${ADMIN_SEED_EMAIL:admin@lms.com}
app.admin.seed.password=${ADMIN_SEED_PASSWORD:Admin@12345}

# ========================
# Logging
# ========================
logging.level.org.springframework.data.mongodb=DEBUG

# ========================
# Spring Mail Configuration
# ========================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true